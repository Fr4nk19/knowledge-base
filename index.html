<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Knowledge Base</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <h1>Knowledge Base</h1>
            </div>
        </header>

        <main class="welcome-section">
            <div class="welcome-content">
                <h2 class="welcome-title">¡Bienvenido!</h2>
                <p class="welcome-subtitle">Tu centro de conocimiento personal</p>

                <div class="features">
                    <div class="feature-card">
                        <span class="feature-icon">🔍</span>
                        <h3>Explora</h3>
                        <p>Descubre recursos y documentación</p>
                    </div>
                    <div class="feature-card">
                        <span class="feature-icon">📝</span>
                        <h3>Aprende</h3>
                        <p>Accede a guías y tutoriales</p>
                    </div>
                    <div class="feature-card">
                        <span class="feature-icon">🚀</span>
                        <h3>Crece</h3>
                        <p>Desarrolla tus habilidades</p>
                    </div>
                </div>

                <button class="cta-button" id="startButton">
                    Comenzar
                    <span class="button-arrow">→</span>
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Knowledge Base. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
